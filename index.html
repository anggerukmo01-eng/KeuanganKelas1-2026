      function formatRupiah(num) {
        if (num === undefined || num === null || isNaN(num)) return 'Rp 0';
        const clean = Math.round(Number(num));
        return 'Rp ' + clean.toLocaleString('id-ID');
      }

      function formatDateIndo(dateStr) {
        if (!dateStr) return '-';
        try {
          const parts = dateStr.split('-');
          if (parts.length === 3) {
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            const date = new Date(year, month, day);
            const months = [
              'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
              'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
            ];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
          }
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return dateStr;
          const months = [
            'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
            'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
          ];
          return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        } catch (e) {
          return dateStr;
        }
      }

      function getTodayISO() {
        const d = new Date();
        const month = String(d.getMonth() + 1).padStart(2, '0');

      }

        showToast(message, type = 'success') {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, message, type });
          this.renderToastsDOM();
          setTimeout(() => {
            this.toasts = this.toasts.filter(t => t.id !== id);
            this.renderToastsDOM();
          }, 3500);
        },

        generateReceiptNo() {
          const today = new Date();
          const y = today.getFullYear();
          const m = String(today.getMonth() + 1).padStart(2, '0');
          const d = String(today.getDate()).padStart(2, '0');
          const prefix = `${this.settings.receiptPrefix || 'KW'}-${y}${m}${d}`;
          const count = this.transactions.filter(t => t.receiptNo && t.receiptNo.startsWith(prefix)).length + 1;
          return `${prefix}-${String(count).padStart(3, '0')}`;
        },

        getStudentSummary(student) {
          if (!student) return null;
          const isPutri = student.gender === 'Putri';
          const applicableItems = this.paymentTypes.filter(pt => {
            if (!pt.active) return false;
            if (pt.applicableGender === 'Semua') return true;
            if (pt.applicableGender === 'Putra' && !isPutri) return true;
            if (pt.applicableGender === 'Putri' && isPutri) return true;
            return false;
          });

          const studentTxs = this.transactions.filter(t => t.studentId === student.id);
          let totalTarget = 0;
          let totalPaid = 0;

          const itemBreakdowns = applicableItems.map(item => {
            const price = isPutri ? item.pricePutri : item.pricePutra;
            totalTarget += price;

            let paidForItem = 0;
            let lastDate = null;
            let notesList = [];
            let specialStatus = null;

            studentTxs.forEach(tx => {
              if (tx.items) {
                tx.items.forEach(txItem => {
                  if (txItem.paymentTypeId === item.id) {
                    paidForItem += (txItem.paidAmount || 0);
                    if (tx.date) lastDate = tx.date;
                    if (txItem.notes) notesList.push(txItem.notes);
                    if (txItem.status && txItem.status !== 'Lunas' && txItem.status !== 'Sebagian') {
                      specialStatus = txItem.status;
                    }
                  }
                });
              }
            });

            totalPaid += paidForItem;
            const remaining = Math.max(0, price - paidForItem);

            let status = 'Belum Bayar';
            if (specialStatus) {
              status = specialStatus;
            } else if (paidForItem >= price && price > 0) {
              status = 'Lunas';
            } else if (paidForItem > 0 && paidForItem < price) {
              status = 'Sebagian';
            }

            return {
              paymentTypeId: item.id,
              name: item.name,
              period: item.period,
              billPrice: price,
              paidAmount: paidForItem,
              remainingAmount: remaining,
              status: status,
              lastPaymentDate: lastDate,
              notes: notesList.join('; ')
            };
          });

          const remainingTarget = Math.max(0, totalTarget - totalPaid);
          let overallStatus = 'BELUM BAYAR';
          if (totalPaid >= totalTarget && totalTarget > 0) {
            overallStatus = 'LUNAS';
          } else if (totalPaid > 0) {
            overallStatus = 'SEBAGIAN';
          }

          return {
            student,
            totalTarget,
            totalPaid,
            remainingTarget,
            overallStatus,
            itemBreakdowns,
            transactionCount: studentTxs.length,
            transactions: studentTxs
          };
        },

        getClassStats() {
          const activeStudents = this.students.filter(s => s.active);
          let totalClassTarget = 0;
          let totalClassPaid = 0;
          let lunasCount = 0;
          let sebagianCount = 0;
          let belumBayarCount = 0;

          activeStudents.forEach(st => {
            const sum = this.getStudentSummary(st);
            totalClassTarget += sum.totalTarget;
            totalClassPaid += sum.totalPaid;
            if (sum.overallStatus === 'LUNAS') lunasCount++;
            else if (sum.overallStatus === 'SEBAGIAN') sebagianCount++;
            else belumBayarCount++;
          });

          const totalClassRemaining = Math.max(0, totalClassTarget - totalClassPaid);
          const progressPercentage = totalClassTarget > 0 ? Math.round((totalClassPaid / totalClassTarget) * 100) : 0;

          const todayStr = getTodayISO();
          const todayTxs = this.transactions.filter(t => t.date === todayStr);
          const todayRevenue = todayTxs.reduce((acc, t) => acc + (t.totalAmount || 0), 0);

          return {
            totalStudents: activeStudents.length,
            totalClassTarget,
            totalClassPaid,
            totalClassRemaining,
            progressPercentage,
            lunasCount,
            sebagianCount,
            belumBayarCount,
            todayTxCount: todayTxs.length,
            todayRevenue
          };
        },

        navigate(tab, extra = {}) {
          if (extra.studentId) this.selectedStudentId = extra.studentId;
          if (extra.receiptId) this.selectedReceiptId = extra.receiptId;
          this.currentTab = tab;

          this.render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

                  onclick="AppActions.navigate('billing')"

                >
                  ${getSvgIcon('billing', 'w-4 h-4')}

                </button>
              </div>

              ${renderStatCard('Jumlah Siswa', `${stats.totalStudents} Siswa`, `${stats.lunasCount} Lunas • ${stats.sebagianCount} Sebagian`, 'users', 'emerald')}
              ${renderStatCard('Total Tagihan Kelas', formatRupiah(stats.totalClassTarget), 'Kewajiban aktif kelas 1', 'billing', 'blue')}
              ${renderStatCard('Sudah Dibayar', formatRupiah(stats.totalClassPaid), `${stats.progressPercentage}% terkumpul`, 'checkCircle', 'emerald')}
              ${renderStatCard('Belum Dibayar', formatRupiah(stats.totalClassRemaining), 'Sisa tunggakan kelas', 'alertCircle', 'rose')}
              ${renderStatCard('Transaksi Hari Ini', `${stats.todayTxCount} Transaksi`, formatDateIndo(getTodayISO()), 'receipt', 'indigo')}
              ${renderStatCard('Uang Masuk Hari Ini', formatRupiah(stats.todayRevenue), 'Penerimaan hari ini', 'creditCard', 'amber')}
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                <div>
                  <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base mb-1">Progress Pembayaran Kelas</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">Status pelunasan dari seluruh ${stats.totalStudents} siswa Kelas 1</p>

                  <div class="flex items-baseline gap-3 mb-4">
                    <span class="text-4xl font-extrabold text-brand-600 dark:text-brand-400">${stats.progressPercentage}%</span>
                    <span class="text-xs text-slate-500 dark:text-slate-400">dari total ${formatRupiah(stats.totalClassTarget)}</span>
                  </div>

                  <div class="h-4 w-full bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden flex mb-6">
                    <div style="width: ${(stats.lunasCount / (stats.totalStudents || 1)) * 100}%" class="bg-emerald-500 h-full"></div>
                    <div style="width: ${(stats.sebagianCount / (stats.totalStudents || 1)) * 100}%" class="bg-amber-500 h-full"></div>
                    <div style="width: ${(stats.belumBayarCount / (stats.totalStudents || 1)) * 100}%" class="bg-rose-500 h-full"></div>
                  </div>

                  <div class="space-y-3">
                    <div class="flex items-center justify-between text-sm">
                      <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                        <span class="text-slate-600 dark:text-slate-300">Lunas (${stats.lunasCount} Siswa)</span>
                      </div>
                      <span class="font-semibold text-slate-800 dark:text-slate-200">
                        ${Math.round((stats.lunasCount / (stats.totalStudents || 1)) * 100)}%
                      </span>
                    </div>

                    <div class="flex items-center justify-between text-sm">
                      <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                        <span class="text-slate-600 dark:text-slate-300">Sebagian (${stats.sebagianCount} Siswa)</span>
                      </div>
                      <span class="font-semibold text-slate-800 dark:text-slate-200">
                        ${Math.round((stats.sebagianCount / (stats.totalStudents || 1)) * 100)}%
                      </span>
                    </div>

                    <div class="flex items-center justify-between text-sm">
                      <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                        <span class="text-slate-600 dark:text-slate-300">Belum Bayar (${stats.belumBayarCount} Siswa)</span>
                      </div>
                      <span class="font-semibold text-slate-800 dark:text-slate-200">
                        ${Math.round((stats.belumBayarCount / (stats.totalStudents || 1)) * 100)}%
                      </span>
                    </div>
                  </div>
                </div>

                <div class="pt-6 mt-6 border-t border-slate-100 dark:border-slate-700">
                  <button
                    onclick="AppActions.navigate('billing')"
                    class="w-full py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-xs font-semibold text-slate-700 dark:text-slate-200 transition-colors flex items-center justify-center gap-2"
                  >
                    <span>Lihat Detail Tagihan Siswa</span>
                    ${getSvgIcon('billing', 'w-4 h-4')}
                  </button>
                </div>
              </div>

              <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-4">
                    <div>
                      <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base">Pembayaran Terbaru</h3>
                      <p class="text-xs text-slate-500 dark:text-slate-400">Transaksi terakhir yang dicatat ke sistem</p>
                    </div>
                    <button
                      onclick="AppActions.navigate('history')"
                      class="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1"
                    >
                      <span>Semua Transaksi</span>
                    </button>
                  </div>

                  ${recentTxs.length === 0 ? `
                    <div class="py-12 text-center text-slate-400 dark:text-slate-500">
                      ${getSvgIcon('receipt', 'w-12 h-12 mx-auto mb-3 opacity-30')}
                      <p class="text-sm font-medium">Belum ada transaksi pembayaran.</p>
                      <p class="text-xs mt-1">Klik tombol 'Transaksi Baru' untuk mencatat pembayaran pertama.</p>
                      <button
                        onclick="AppActions.navigate('payment')"
                        class="mt-4 px-4 py-2 bg-brand-600 text-white text-xs font-semibold rounded-xl hover:bg-brand-700 transition-colors inline-flex items-center gap-1.5"
                      >
                        ${getSvgIcon('plus', 'w-3.5 h-3.5')}
                        <span>Buat Transaksi Sekarang</span>
                      </button>
                    </div>
                  ` : `
                    <div class="overflow-x-auto">
                      <table class="w-full text-left text-sm">
                        <thead>
                          <tr class="border-b border-slate-100 dark:border-slate-700 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                            <th class="pb-3">No. Kwitansi</th>
                            <th class="pb-3">Siswa</th>
                            <th class="pb-3">Tanggal</th>
                            <th class="pb-3 text-right">Nominal</th>
                            <th class="pb-3 text-center">Aksi</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 dark:divide-slate-700/60">
                          ${recentTxs.map(tx => `
                            <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors">
                              <td class="py-3 font-mono text-xs font-semibold text-brand-600 dark:text-brand-400">${escapeHtml(tx.receiptNo)}</td>
                              <td class="py-3 font-medium text-slate-800 dark:text-slate-200">${escapeHtml(tx.studentName)}</td>
                              <td class="py-3 text-xs text-slate-500 dark:text-slate-400">${formatDateIndo(tx.date)}</td>
                              <td class="py-3 text-right font-bold text-slate-800 dark:text-slate-100">${formatRupiah(tx.totalAmount)}</td>
                              <td class="py-3 text-center">
                                <div class="flex items-center justify-center gap-1">
                                  <button
                                    onclick="AppActions.navigate('receipt', { receiptId: '${tx.id}' })"
                                    class="px-2.5 py-1 text-xs bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-brand-600 hover:text-white transition-colors"
                                  >
                                    Kwitansi
                                  </button>
                                  <button
                                    onclick="AppActions.openEditTransaction('${tx.id}')"
                                    class="px-2.5 py-1 text-xs bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 rounded-lg hover:bg-amber-600 hover:text-white transition-colors font-medium"
                                  >
                                    Edit
                                  </button>
                                </div>
                              </td>
                            </tr>
                          `).join('')}
                        </tbody>
                      </table>
                    </div>
                  `}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderStatCard(title, value, sub, icon, color) {
        const colorMap = {
          emerald: 'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800/50',
          blue: 'bg-sky-50 dark:bg-sky-950/30 text-sky-600 dark:text-sky-400 border-sky-200 dark:border-sky-800/50',
          rose: 'bg-rose-50 dark:bg-rose-950/30 text-rose-600 dark:text-rose-400 border-rose-200 dark:border-rose-800/50',
          indigo: 'bg-indigo-50 dark:bg-indigo-950/30 text-indigo-600 dark:text-indigo-400 border-indigo-200 dark:border-indigo-800/50',
          amber: 'bg-amber-50 dark:bg-amber-950/30 text-amber-600 dark:text-amber-400 border-amber-200 dark:border-amber-800/50'
        };

        return `
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 truncate">${title}</span>
              <div class="p-2 rounded-xl border ${colorMap[color] || colorMap.emerald}">
                ${getSvgIcon(icon, 'w-4 h-4')}
              </div>
            </div>
            <div>
              <div class="text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">${value}</div>
              <div class="text-[11px] text-slate-400 dark:text-slate-500 mt-1 truncate">${sub}</div>
            </div>
          </div>
        `;
      }

      function renderPaymentPOS() {
        const student = Store.students.find(s => s.id === Store.pos.studentId);
        const summary = student ? Store.getStudentSummary(student) : null;

        let totalPayable = 0;
        Object.values(Store.pos.selectedItems).forEach(it => {
          if (it.checked) totalPayable += Number(it.paidAmount) || 0;
        });

        const cashRec = Number(Store.pos.cashReceived) || 0;
        const change = cashRec - totalPayable;
        const isShortage = change < 0;

        return `
          <div class="max-w-5xl mx-auto space-y-6" id="pos_container">
            <!-- STEP 1: CARI SISWA -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm">
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                  <span class="w-7 h-7 rounded-full bg-brand-600 text-white font-bold text-xs flex items-center justify-center">1</span>
                  <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base">Cari & Pilih Siswa</h3>
                </div>
                ${student ? `
                  <button onclick="AppActions.resetPOS()" class="text-xs text-rose-600 dark:text-rose-400 font-semibold hover:underline flex items-center gap-1">
                    ${getSvgIcon('refresh', 'w-3.5 h-3.5')}
                    <span>Ganti Siswa</span>
                  </button>
                ` : ''}
              </div>

              <div class="relative" id="pos_search_wrapper">
                <div class="relative">
                  <input 
                    type="text"
                    id="pos_student_search_input"
                    placeholder="Ketik nama siswa, orang tua (ayah/ibu), atau NIS..."
                    value="${escapeHtml(Store.pos.studentSearch)}"
                    oninput="AppActions.onPOSSearchInput(this.value)"
                    onfocus="AppActions.onPOSSearchFocus()"
                    onkeydown="AppActions.onPOSSearchKeyDown(event)"
                    autocomplete="off"
                    class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white"
                  />
                  <div class="absolute left-3 top-3.5 text-slate-400 pointer-events-none">
                    ${getSvgIcon('search', 'w-5 h-5')}
                  </div>
                </div>

                <div 
                  id="pos_student_dropdown" 
                  class="absolute z-30 top-full left-0 right-0 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl max-h-64 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700 ${Store.pos.dropdownOpen ? '' : 'hidden'}"
                >
                  <!-- Populated dynamically by updatePOSSearchDropdown -->
                </div>
              </div>

              <div id="pos_selected_student_card">
                ${student && summary ? renderSelectedStudentCard(student, summary) : ''}
              </div>
            </div>

            <!-- STEP 2 & 3 CONTAINER -->
            <div id="pos_items_and_cashier_section" class="${student ? '' : 'hidden'}">
              ${student ? renderPOSItemsAndCashier(student, totalPayable, cashRec, change, isShortage) : ''}
            </div>
          </div>
        `;
      }

      function renderSelectedStudentCard(student, summary) {
        return `
          <div class="mt-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-700/30 border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center text-lg font-bold ${
                student.gender === 'Putri' ? 'bg-pink-100 text-pink-700 dark:bg-pink-900/50 dark:text-pink-300' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300'
              }">
                ${student.name.charAt(0)}
              </div>
              <div>
                <h4 class="font-bold text-base text-slate-800 dark:text-slate-100">${escapeHtml(student.name)}</h4>
                <p class="text-xs text-slate-500 dark:text-slate-400">
                  Kelas ${student.class || '1'} • Gender: <span class="font-semibold text-slate-700 dark:text-slate-200">${student.gender}</span> • Orang Tua: <span class="font-bold text-brand-600 dark:text-brand-400">${escapeHtml(student.parentName || student.father || student.mother || '-')}</span>
                </p>
                <p class="text-[11px] text-slate-400 mt-0.5">
                  Ayah: ${escapeHtml(student.father || '-')} • Ibu: ${escapeHtml(student.mother || '-')} • Alamat: ${escapeHtml(student.address || '-')}
                </p>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-3 text-xs">
              <div class="bg-white dark:bg-slate-800 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700">
                <span class="text-slate-400 block">Total Tagihan:</span>
                <span class="font-bold text-slate-700 dark:text-slate-200">${formatRupiah(summary.totalTarget)}</span>
              </div>
              <div class="bg-white dark:bg-slate-800 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700">
                <span class="text-slate-400 block">Sudah Dibayar:</span>
                <span class="font-bold text-emerald-600 dark:text-emerald-400">${formatRupiah(summary.totalPaid)}</span>
              </div>
              <div class="bg-white dark:bg-slate-800 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700">
                <span class="text-slate-400 block">Sisa Tagihan:</span>
                <span class="font-bold text-rose-600 dark:text-rose-400">${formatRupiah(summary.remainingTarget)}</span>
              </div>
            </div>
          </div>
        `;
      }

      function renderPOSItemsAndCashier(student, totalPayable, cashRec, change, isShortage) {
        return `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- ITEM CHECKLIST -->
            <div class="lg:col-span-2 space-y-4">
              <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                  <div class="flex items-center gap-2">
                    <span class="w-7 h-7 rounded-full bg-brand-600 text-white font-bold text-xs flex items-center justify-center">2</span>
                    <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base">Pilih Item Pembayaran</h3>
                  </div>
                  <label class="text-xs text-slate-500 flex items-center gap-1.5 cursor-pointer">
                    <input 
                      type="checkbox" 
                      ${Store.pos.allowPaidOverride ? 'checked' : ''} 
                      onchange="AppActions.togglePOSOverride(this.checked)"
                      class="rounded border-slate-300 text-brand-600 focus:ring-brand-500"
                    />
                    <span>Tampilkan Item Lunas</span>
                  </label>
                </div>

                <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">
                  Harga tagihan disesuaikan otomatis untuk siswa <span class="font-semibold text-slate-700 dark:text-slate-200">${student.gender}</span>.
                </p>

                <div class="space-y-3" id="pos_items_list">
                  ${Object.entries(Store.pos.selectedItems).map(([ptId, item]) => {
                    const isLunas = item.isPreviouslyLunas;
                    if (isLunas && !Store.pos.allowPaidOverride) {
                      return `
                        <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/20 border border-slate-200/60 dark:border-slate-700/60 flex items-center justify-between text-xs opacity-60">
                          <div class="flex items-center gap-2">
                            <span class="w-4 h-4 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-[10px] font-bold">✓</span>
                            <span class="font-semibold text-slate-700 dark:text-slate-300">${escapeHtml(item.name)}</span>
                            <span class="text-slate-400">(${formatRupiah(item.billPrice)})</span>
                          </div>
                          <div>
                            <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300 font-bold text-[10px]">
                              LUNAS ${item.lastPaymentDate ? `(${formatDateIndo(item.lastPaymentDate)})` : ''}
                            </span>
                          </div>
                        </div>
                      `;
                    }

                    return `
                      <div 
                        id="pos_item_card_${ptId}"
                        class="p-4 rounded-xl border transition-all ${
                          item.checked 
                            ? 'bg-emerald-50/40 dark:bg-emerald-950/20 border-emerald-300 dark:border-emerald-700/60 shadow-sm' 
                            : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700'
                        }"
                      >
                        <div class="flex items-start justify-between gap-3">
                          <div class="flex items-start gap-3 flex-1">
                            <input 
                              type="checkbox"
                              id="pos_item_chk_${ptId}"
                              ${item.checked ? 'checked' : ''}
                              onchange="AppActions.onPOSItemCheckboxToggle('${ptId}', this.checked)"
                              class="mt-1 w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500 cursor-pointer"
                            />
                            <div class="flex-1 min-w-0">
                              <div class="flex flex-wrap items-center gap-2">
                                <span class="font-bold text-sm text-slate-800 dark:text-slate-100">${escapeHtml(item.name)}</span>
                                <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">(${item.period})</span>
                                ${isLunas ? `
                                  <span class="px-2 py-0.2 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-300">
                                    Lunas Sebelumnya
                                  </span>
                                ` : ''}
                                ${item.alreadyPaid > 0 && !isLunas ? `
                                  <span class="px-2 py-0.2 rounded text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-900 dark:text-amber-300">
                                    Sudah Bayar ${formatRupiah(item.alreadyPaid)}
                                  </span>
                                ` : ''}
                              </div>
                              <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                Tagihan: <span class="font-semibold text-slate-700 dark:text-slate-200">${formatRupiah(item.billPrice)}</span>
                                ${item.remainingAmount < item.billPrice ? `
                                  <span class="ml-2 text-rose-600 dark:text-rose-400 font-medium">Sisa: ${formatRupiah(item.remainingAmount)}</span>
                                ` : ''}
                              </div>
                            </div>
                          </div>

                          <div class="text-right">
                            <div class="text-xs text-slate-400 mb-1">Nominal Dibayar:</div>
                            <div class="relative inline-block w-36">
                              <span class="absolute left-2.5 top-2 text-xs text-slate-400 font-semibold pointer-events-none">Rp</span>
                              <input 
                                type="number"
                                id="pos_item_inp_${ptId}"
                                ${!item.checked ? 'disabled' : ''}
                                value="${item.paidAmount}"
                                oninput="AppActions.onPOSItemAmountInput('${ptId}', this.value)"
                                class="w-full pl-8 pr-2 py-1.5 text-right font-bold text-sm bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 disabled:bg-slate-100 disabled:opacity-50 dark:text-white"
                              />
                            </div>
                          </div>
                        </div>

                        <div id="pos_item_extra_${ptId}" class="${item.checked ? '' : 'hidden'} mt-3 pt-3 border-t border-slate-100 dark:border-slate-700/60 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                          <div>
                            <label class="text-[11px] text-slate-400 block mb-1">Status / Kondisi Khusus:</label>
                            <select
                              onchange="AppActions.onPOSItemStatusSelect('${ptId}', this.value)"
                              class="w-full py-1.5 px-2 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-700 dark:text-slate-200"
                            >
                              <option value="Sudah Dibayar" ${item.status === 'Sudah Dibayar' ? 'selected' : ''}>Sudah Dibayar</option>
                              <option value="Dibayar ke Guru Lain" ${item.status === 'Dibayar ke Guru Lain' ? 'selected' : ''}>Dibayar ke Guru Lain (Olahraga/Agama/Wali)</option>
                              <option value="Dibayar Sebagian" ${item.status === 'Dibayar Sebagian' ? 'selected' : ''}>Dibayar Sebagian (Cicil)</option>
                              <option value="Gratis/Pembebasan" ${item.status === 'Gratis/Pembebasan' ? 'selected' : ''}>Gratis / Pembebasan</option>
                              <option value="Koreksi" ${item.status === 'Koreksi' ? 'selected' : ''}>Koreksi Pembayaran</option>
                            </select>
                          </div>
                          <div>
                            <label class="text-[11px] text-slate-400 block mb-1">Keterangan Tambahan:</label>
                            <input 
                              type="text"
                              placeholder="Contoh: Titip Bu Siti / Cicilan 1..."
                              value="${escapeHtml(item.notes || '')}"
                              oninput="AppActions.onPOSItemNotesInput('${ptId}', this.value)"
                              class="w-full py-1.5 px-2 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-slate-700 dark:text-slate-200"
                            />
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3 bg-emerald-50/60 dark:bg-emerald-950/30 rounded-xl border border-emerald-200 dark:border-emerald-800">
                    <div>
                      <span class="text-slate-500 dark:text-slate-400 block mb-0.5">Total Nominal Transaksi:</span>

                    </div>
                    <div>
                      <label class="text-slate-500 dark:text-slate-400 block mb-0.5 font-semibold">Uang Diterima dari Ortu (Rp):</label>

                    Simpan Perubahan & Koreksi
                  </button>
                  <button onclick="AppActions.closeModal()" class="px-5 py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold rounded-xl text-xs">
                    Batal
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        return '';
      }

      function renderToasts() {
        if (Store.toasts.length === 0) return '';
        return `
          <div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4">
            ${Store.toasts.map(toast => `
              <div class="p-4 rounded-xl shadow-lg border text-sm font-medium flex items-center gap-3 pointer-events-auto ${
                toast.type === 'success' ? 'bg-emerald-600 text-white border-emerald-700 shadow-emerald-500/20' :
                toast.type === 'error' ? 'bg-rose-600 text-white border-rose-700 shadow-rose-500/20' :
                toast.type === 'info' ? 'bg-sky-600 text-white border-sky-700 shadow-sky-500/20' :
                'bg-amber-600 text-white border-amber-700 shadow-amber-500/20'
              }">
                ${getSvgIcon(toast.type === 'success' ? 'checkCircle' : 'alertCircle', 'w-5 h-5 flex-shrink-0')}
                <span class="flex-1">${escapeHtml(toast.message)}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      window.AppActions = {
        navigate(tab, extra) {
          Store.navigate(tab, extra);
          if (tab === 'history') this.updateHistoryTableDOM();
          if (tab === 'billing') this.updateBillingTableDOM();
          if (tab === 'students') this.updateStudentsTableDOM();
        },

        toggleSidebar(open) {
          Store.sidebarOpen = open !== undefined ? open : !Store.sidebarOpen;
          Store.render();
        },

        toggleDarkMode() {
          Store.settings.darkMode = !Store.settings.darkMode;
          if (Store.settings.darkMode) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          Store.save();
          Store.render();
        },

        // --- RESET PEMBAYARAN PER INDIVIDU SISWA ---
        openResetStudentModal(studentId) {
          const st = Store.students.find(s => s.id === studentId);
          if (!st) return;
          const studentTxs = Store.transactions.filter(t => t.studentId === studentId);
          if (studentTxs.length === 0) {
            Store.showToast(`Siswa "${st.name}" belum memiliki riwayat pembayaran untuk di-reset.`, 'info');
            return;
          }
          const totalAmount = studentTxs.reduce((acc, t) => acc + (t.totalAmount || 0), 0);
          Store.modal = {
            type: 'CONFIRM',
            title: 'Reset Pembayaran Siswa?',
            message: `Anda yakin ingin menghapus seluruh riwayat pembayaran (${studentTxs.length} transaksi - ${formatRupiah(totalAmount)}) khusus untuk siswa "${st.name}"? Data profil siswa tetap tersimpan. Transaksi siswa lainnya tidak akan terpengaruh.`,
            confirmText: 'Ya, Reset Pembayaran Siswa Ini',
            variant: 'danger',
            onConfirm: () => {
              Store.transactions = Store.transactions.filter(t => t.studentId !== studentId);
              if (Store.selectedReceiptId) {
                const exists = Store.transactions.some(t => t.id === Store.selectedReceiptId);
                if (!exists) Store.selectedReceiptId = null;
              }
              Store.save();
              Store.showToast(`Seluruh riwayat pembayaran siswa "${st.name}" berhasil di-reset.`, 'warning');
              Store.render();
              if (Store.currentTab === 'history') window.AppActions.updateHistoryTableDOM();
              if (Store.currentTab === 'billing') window.AppActions.updateBillingTableDOM();
              if (Store.currentTab === 'students') window.AppActions.updateStudentsTableDOM();
            }
          };
          Store.render();
        },

        triggerResetSelectedStudentFromSettings() {
          const select = document.getElementById('settings_reset_student_select');
          if (!select || !select.value) {
            Store.showToast('Silakan pilih salah satu siswa dari daftar.', 'error');
            return;
          }
          this.openResetStudentModal(select.value);
        },

        // --- SCHOOL LOGO MANAGEMENT ---
        handleLogoUpload(input) {
          const file = input.files[0];
          if (!file) return;
          if (!file.type.startsWith('image/')) {
            Store.showToast('Harap pilih file gambar (PNG, JPG, SVG).', 'error');
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            Store.settings.schoolLogo = e.target.result;
            Store.save();
            Store.showToast('Logo sekolah berhasil diperbarui!');
            Store.render();
          };
          reader.readAsDataURL(file);
          input.value = '';
        },

        resetSchoolLogo() {
          Store.settings.schoolLogo = null;
          Store.save();
          Store.showToast('Logo sekolah dikembalikan ke logo standar.', 'warning');
          Store.render();
        },

        // --- SIGNATURE UPLOAD & MANAGEMENT ---
        handleSignatureUpload(input) {
          const file = input.files[0];
          if (!file) return;
          if (!file.type.startsWith('image/')) {
            Store.showToast('Harap pilih file gambar (PNG, JPG, SVG).', 'error');
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            Store.settings.teacherSignature = e.target.result;
            Store.settings.showTeacherSignature = true;
            Store.save();
            Store.showToast('Tanda tangan guru berhasil diunggah!');

          reader.readAsDataURL(file);

          Store.settings.showTeacherSignature = checked;
          Store.save();
          Store.render();
        },

        // --- GLOBAL SEARCH MODAL ---
        openGlobalSearch() {
          Store.modal = { type: 'SEARCH' };
          Store.render();
          setTimeout(() => {
            const input = document.getElementById('globalSearchInput');
            if (input) input.focus();
          }, 50);
        },

        onGlobalSearchInput(val) {
          const container = document.getElementById('globalSearchResults');
          if (!container) return;
          if (!val.trim()) {
            container.innerHTML = '<div class="p-6 text-center text-slate-400">Ketik nama siswa atau no kwitansi...</div>';
            return;
          }
          const q = val.toLowerCase();
          const matchedStudents = Store.students.filter(s => s.name.toLowerCase().includes(q) || (s.nis && s.nis.includes(q)) || (s.parentName && s.parentName.toLowerCase().includes(q))).map(s => `
            <div onclick="AppActions.closeModal(); AppActions.navigate('student-detail', { studentId: '${s.id}' })" class="p-3.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer flex items-center justify-between">
              <div>
                <div class="font-bold text-slate-800 dark:text-slate-100">${escapeHtml(s.name)}</div>
                <div class="text-slate-500">Kelas ${s.class || '1'} • Ortu: ${escapeHtml(s.parentName || s.father || s.mother || '-')}</div>
              </div>
              <span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300">Siswa</span>
            </div>
          `);

          const matchedTxs = Store.transactions.filter(t => t.receiptNo.toLowerCase().includes(q) || t.studentName.toLowerCase().includes(q) || (t.parentName && t.parentName.toLowerCase().includes(q))).slice(0, 5).map(t => `
            <div onclick="AppActions.closeModal(); AppActions.navigate('receipt', { receiptId: '${t.id}' })" class="p-3.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer flex items-center justify-between">
              <div>
                <div class="font-bold text-slate-800 dark:text-slate-100">${escapeHtml(t.receiptNo)} — ${escapeHtml(t.studentName)}</div>
                <div class="text-slate-500">${formatDateIndo(t.date)} • Ortu: ${escapeHtml(t.parentName || '-')} • ${formatRupiah(t.totalAmount)}</div>
              </div>
              <span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300">Kwitansi</span>
            </div>
          `);

          const all = [...matchedStudents, ...matchedTxs];
          container.innerHTML = all.length ? all.join('') : '<div class="p-6 text-center text-slate-400">Tidak ada hasil yang cocok.</div>';

        closeModal() {
          Store.modal = null;
          Store.render();
        },

        confirmModalAction() {
          if (Store.modal && Store.modal.onConfirm) {
            Store.modal.onConfirm();
          }
          Store.modal = null;
          Store.render();
        },

        // --- POS CASHIER REAL-TIME OPTIMIZATIONS (NO FOCUS LOSS) ---
        onPOSSearchInput(val) {
          Store.pos.studentSearch = val;
          this.updatePOSSearchDropdown();
        },

        onPOSSearchFocus() {
          Store.pos.dropdownOpen = true;
          this.updatePOSSearchDropdown();
        },

        onPOSSearchKeyDown(e) {
          const dropdown = document.getElementById('pos_student_dropdown');
          if (!dropdown) return;
          const items = dropdown.querySelectorAll('.pos-student-item');
          if (items.length === 0) return;

          if (e.key === 'ArrowDown') {
            e.preventDefault();
            const first = items[0];
            if (first) first.focus();
          }
        },

        updatePOSSearchDropdown() {
          const dropdown = document.getElementById('pos_student_dropdown');
          if (!dropdown) return;

          const q = (Store.pos.studentSearch || '').toLowerCase().trim();
          const filtered = Store.students.filter(s => {
            if (!s.active) return false;
            if (!q) return true;
            return s.name.toLowerCase().includes(q) || 
                   (s.nis && s.nis.includes(q)) || 
                   (s.parentName && s.parentName.toLowerCase().includes(q)) ||
                   (s.father && s.father.toLowerCase().includes(q)) ||
                   (s.mother && s.mother.toLowerCase().includes(q)) ||
                   (s.address && s.address.toLowerCase().includes(q));
          });

          if (filtered.length === 0) {
            dropdown.innerHTML = '<div class="p-4 text-center text-xs text-slate-400">Tidak ada siswa yang cocok.</div>';
          } else {
            dropdown.innerHTML = filtered.map(st => `
              <div 
                tabindex="0"
                onclick="AppActions.selectPOSStudent('${st.id}')"
                onkeydown="if(event.key==='Enter') AppActions.selectPOSStudent('${st.id}')"
                class="pos-student-item p-3 hover:bg-brand-50 dark:hover:bg-brand-950/40 focus:bg-brand-50 dark:focus:bg-brand-950/40 cursor-pointer flex items-center justify-between text-sm transition-colors outline-none"
              >
                <div>
                  <div class="font-semibold text-slate-800 dark:text-slate-100">${escapeHtml(st.name)}</div>
                  <div class="text-xs text-slate-500 dark:text-slate-400">
                    Kelas ${st.class || '1'} • ${st.gender} • Ortu: <span class="font-medium text-slate-700 dark:text-slate-300">${escapeHtml(st.parentName || st.father || st.mother || '-')}</span>
                  </div>
                </div>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                  st.gender === 'Putri' ? 'bg-pink-100 text-pink-700 dark:bg-pink-950 dark:text-pink-300' : 'bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300'
                }">
                  ${st.gender}
                </span>
              </div>
            `).join('');
          }

          dropdown.classList.remove('hidden');
        },

        selectPOSStudent(id) {
          const st = Store.students.find(s => s.id === id);
          if (!st) return;
          Store.pos.studentId = st.id;
          Store.pos.studentSearch = st.name;
          Store.pos.customParentName = st.parentName || st.father || st.mother || '';
          Store.pos.dropdownOpen = false;

          const summary = Store.getStudentSummary(st);
          const newSelected = {};
          summary.itemBreakdowns.forEach(item => {
            const isLunas = item.status === 'Lunas';
            newSelected[item.paymentTypeId] = {
              checked: !isLunas,
              paidAmount: item.remainingAmount,
              billPrice: item.billPrice,
              alreadyPaid: item.paidAmount,
              remainingAmount: item.remainingAmount,
              name: item.name,
              period: item.period,
              notes: '',
              status: item.remainingAmount === 0 ? 'Lunas' : 'Sudah Dibayar',
              isPreviouslyLunas: isLunas,
              lastPaymentDate: item.lastPaymentDate
            };
          });

          Store.pos.selectedItems = newSelected;
          Store.pos.cashReceived = '';
          Store.currentTab = 'payment';
          Store.render();
        },

        resetPOS() {
          Store.pos.studentId = null;
          Store.pos.studentSearch = '';
          Store.pos.customParentName = '';
          Store.pos.selectedItems = {};
          Store.pos.cashReceived = '';
          Store.pos.generalNotes = '';
          Store.pos.receiptNo = Store.generateReceiptNo();
          Store.render();
        },

        setPOSParentPreset(name) {
          Store.pos.customParentName = name;
          const input = document.getElementById('pos_parent_name_input');
          if (input) input.value = name;
        },

        onPOSCashInput(val) {
          Store.pos.cashReceived = val;
          this.updatePOSCalculationUI();
        },

        onPOSItemAmountInput(ptId, val) {
          const num = Math.max(0, parseInt(val, 10) || 0);
          if (Store.pos.selectedItems[ptId]) {
            Store.pos.selectedItems[ptId].paidAmount = num;
          }
          this.updatePOSCalculationUI();
        },

        onPOSItemCheckboxToggle(ptId, checked) {
          if (Store.pos.selectedItems[ptId]) {
            Store.pos.selectedItems[ptId].checked = checked;
            
            const card = document.getElementById(`pos_item_card_${ptId}`);
            if (card) {
              if (checked) {
                card.className = "p-4 rounded-xl border transition-all bg-emerald-50/40 dark:bg-emerald-950/20 border-emerald-300 dark:border-emerald-700/60 shadow-sm";
              } else {
                card.className = "p-4 rounded-xl border transition-all bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700";
              }
            }

            const inp = document.getElementById(`pos_item_inp_${ptId}`);
            if (inp) inp.disabled = !checked;

            const extra = document.getElementById(`pos_item_extra_${ptId}`);
            if (extra) {
              if (checked) extra.classList.remove('hidden');
              else extra.classList.add('hidden');
            }

            this.updatePOSCalculationUI();
          }
        },

        onPOSItemNotesInput(ptId, val) {
          if (Store.pos.selectedItems[ptId]) {
            Store.pos.selectedItems[ptId].notes = val;
          }
        },

        onPOSItemStatusSelect(ptId, val) {
          if (Store.pos.selectedItems[ptId]) {
            Store.pos.selectedItems[ptId].status = val;
          }
        },

        updatePOSCalculationUI() {
          let totalPayable = 0;
          Object.values(Store.pos.selectedItems).forEach(it => {
            if (it.checked) totalPayable += Number(it.paidAmount) || 0;
          });

          const totalDisp = document.getElementById('pos_total_payable_display');
          if (totalDisp) totalDisp.innerText = formatRupiah(totalPayable);

          const cashRec = Number(Store.pos.cashReceived) || 0;
          const change = cashRec - totalPayable;
          const isShortage = change < 0;

          const changeContainer = document.getElementById('pos_change_container');
          const changeLabel = document.getElementById('pos_change_label');
          const changeDisp = document.getElementById('pos_change_display');

          if (changeContainer && changeLabel && changeDisp) {
            if (cashRec > 0) {
              changeContainer.classList.remove('hidden');
              if (isShortage) {
                changeContainer.className = "p-3 rounded-xl border mb-4 bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300";
                changeLabel.innerText = "Kurang / Bayar Sebagian:";
              } else {
                changeContainer.className = "p-3 rounded-xl border mb-4 bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300";
                changeLabel.innerText = "Kembalian:";
              }
              changeDisp.innerText = formatRupiah(Math.abs(change));
            } else {
              changeContainer.classList.add('hidden');
            }
          }

          const btnSave = document.getElementById('pos_btn_save');
          const btnSavePrint = document.getElementById('pos_btn_save_print');
          if (btnSave) btnSave.disabled = (totalPayable <= 0);
          if (btnSavePrint) btnSavePrint.disabled = (totalPayable <= 0);
        },

        setPOSQuickCash(amount) {
          if (amount === 'PAS') {
            let totalPayable = 0;
            Object.values(Store.pos.selectedItems).forEach(it => {
              if (it.checked) totalPayable += Number(it.paidAmount) || 0;
            });
            Store.pos.cashReceived = String(totalPayable);
          } else {
            Store.pos.cashReceived = String(amount);
          }

          const inp = document.getElementById('pos_cash_received_input');
          if (inp) inp.value = Store.pos.cashReceived;
          this.updatePOSCalculationUI();
        },

        togglePOSOverride(checked) {
          Store.pos.allowPaidOverride = checked;
          Store.render();
        },

        savePOSTransaction(autoPrint = false) {
          const st = Store.students.find(s => s.id === Store.pos.studentId);
          if (!st) {
            Store.showToast('Silakan pilih siswa terlebih dahulu.', 'error');
            return;
          }

          const checkedEntries = Object.entries(Store.pos.selectedItems).filter(([_, it]) => it.checked && it.paidAmount > 0);
          if (checkedEntries.length === 0) {
            Store.showToast('Pilih minimal 1 item pembayaran dengan nominal > 0.', 'error');
            return;
          }

          let total = 0;
          const items = checkedEntries.map(([ptId, it]) => {
            total += it.paidAmount;
            return {
              paymentTypeId: ptId,
              paymentTypeName: it.name,
              billAmount: it.billPrice,
              paidAmount: it.paidAmount,
              status: it.paidAmount >= it.remainingAmount ? 'Lunas' : 'Sebagian',
              notes: it.notes || ''
            };
          });

          const cashRec = Number(Store.pos.cashReceived) || total;
          const change = Math.max(0, cashRec - total);
          const parentNameSaved = Store.pos.customParentName.trim() || st.parentName || st.father || st.mother || '';

          const newTx = {
            id: 'tx-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
            receiptNo: Store.pos.receiptNo || Store.generateReceiptNo(),
            date: Store.pos.date || getTodayISO(),
            studentId: st.id,
            studentName: st.name,
            studentGender: st.gender,
            studentClass: st.class || '1',
            parentName: parentNameSaved,
            items: items,
            totalAmount: total,
            cashReceived: cashRec,
            changeAmount: change,
            officer: Store.settings.officerName,
            generalNotes: Store.pos.generalNotes || '',
            createdAt: new Date().toISOString(),
            isCorrected: false
          };

          Store.transactions.unshift(newTx);
          Store.save();
          Store.showToast(`Pembayaran ${formatRupiah(total)} berhasil disimpan.`);

          if (autoPrint) {
            Store.selectedReceiptId = newTx.id;
            Store.navigate('receipt');
          } else {
            this.resetPOS();
            Store.navigate('history');
          }
        },

        // --- HISTORY REAL-TIME SEARCH & TABLE DOM UPDATES ---
        onHistorySearchInput(val) {
          Store.historyFilter.search = val;
          this.updateHistoryTableDOM();
        },

        updateHistoryTableDOM() {
          const tbody = document.getElementById('history_table_tbody');
          const summary = document.getElementById('history_count_summary');
          if (!tbody) return;

          const filtered = Store.transactions.filter(tx => {
            if (Store.historyFilter.studentId !== 'ALL' && tx.studentId !== Store.historyFilter.studentId) return false;
            if (Store.historyFilter.startDate && tx.date < Store.historyFilter.startDate) return false;
            if (Store.historyFilter.endDate && tx.date > Store.historyFilter.endDate) return false;
            if (Store.historyFilter.search) {
              const q = Store.historyFilter.search.toLowerCase();
              const matchNo = tx.receiptNo && tx.receiptNo.toLowerCase().includes(q);
              const matchName = tx.studentName && tx.studentName.toLowerCase().includes(q);
              const matchParent = tx.parentName && tx.parentName.toLowerCase().includes(q);
              const matchItems = tx.items && tx.items.some(i => i.paymentTypeName && i.paymentTypeName.toLowerCase().includes(q));
              if (!matchNo && !matchName && !matchParent && !matchItems) return false;
            }
            return true;
          }).sort((a, b) => {

              if (Store.billingFilter.search) {
                const q = Store.billingFilter.search.toLowerCase();
                return sum.student.name.toLowerCase().includes(q) || (sum.student.nis && sum.student.nis.includes(q)) || (sum.student.parentName && sum.student.parentName.toLowerCase().includes(q));

        onEditTxItemAmount(idx, val) {
          if (Store.modal && Store.modal.editItems && Store.modal.editItems[idx]) {
            Store.modal.editItems[idx].paidAmount = Math.max(0, parseInt(val, 10) || 0);
            Store.render();
          }
        },

        onEditTxItemStatus(idx, val) {
          if (Store.modal && Store.modal.editItems && Store.modal.editItems[idx]) {
            Store.modal.editItems[idx].status = val;
          }

        saveEditTransaction() {
          const tx = Store.modal.transaction;
          const editItems = Store.modal.editItems;
          const date = document.getElementById('etf_date').value;
          const parentName = document.getElementById('etf_parentName').value;
          const officer = document.getElementById('etf_officer').value;
          const notes = document.getElementById('etf_notes').value;
          const corrNote = document.getElementById('etf_correctionNote').value;

          let newTotal = 0;
          editItems.forEach(it => { newTotal += (Number(it.paidAmount) || 0); });

          const cashRec = Number(document.getElementById('etf_cashReceived').value) || newTotal;
          const change = Math.max(0, cashRec - newTotal);

          const updated = {
            ...tx,
            date: date,
            parentName: parentName,
            items: editItems,
            totalAmount: newTotal,
            cashReceived: cashRec,
            changeAmount: change,
            officer: officer,
            generalNotes: notes,
            isCorrected: true,
            updatedAt: new Date().toISOString(),
            correctionHistory: [
              ...(tx.correctionHistory || []),
              { correctedAt: new Date().toISOString(), note: corrNote || 'Koreksi data pembayaran' }
            ]
          };

          Store.transactions = Store.transactions.map(t => t.id === tx.id ? updated : t);
          Store.save();
          Store.closeModal();
          Store.showToast(`Transaksi ${tx.receiptNo} berhasil diperbarui.`);
          this.updateHistoryTableDOM();
        },

        deleteTransaction(id) {
          const tx = Store.transactions.find(t => t.id === id);
          if (!tx) return;
          Store.modal = {
            type: 'CONFIRM',
            title: 'Hapus Transaksi?',
            message: `Anda yakin ingin menghapus kwitansi ${tx.receiptNo} (${tx.studentName} - ${formatRupiah(tx.totalAmount)})?`,
            confirmText: 'Ya, Hapus Transaksi',
            variant: 'danger',
            onConfirm: () => {
              Store.transactions = Store.transactions.filter(t => t.id !== id);
              Store.save();
              Store.showToast(`Transaksi ${tx.receiptNo} telah dihapus.`, 'warning');
              window.AppActions.updateHistoryTableDOM();
            }
          };
          Store.render();
        },

        exportStudentsCSV() {
          const headers = ["ID", "Nama Lengkap", "Jenis Kelamin", "Kelas", "Nama Orang Tua (Kwitansi)", "Ayah", "Ibu", "Pekerjaan", "TTL", "Alamat", "No WhatsApp", "Status"];
          const rows = Store.students.map(s => [
            s.id,
            `"${s.name.replace(/"/g, '""')}"`,
            s.gender,
            s.class || '1',
            `"${(s.parentName || s.father || s.mother || '').replace(/"/g, '""')}"`,
            `"${(s.father || '').replace(/"/g, '""')}"`,
            `"${(s.mother || '').replace(/"/g, '""')}"`,
            `"${(s.job || '').replace(/"/g, '""')}"`,
            `"${(s.ttl || '').replace(/"/g, '""')}"`,
            `"${(s.address || '').replace(/"/g, '""')}"`,
            s.phone || '',
            s.active ? 'Aktif' : 'Nonaktif'
          ]);

          const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(r => r.join(','))].join("\n");
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `data_siswa_kelas_1_${getTodayISO()}.csv`);
          document.body.appendChild(link);
          link.click();
          link.remove();
          Store.showToast('Data siswa berhasil diexport ke CSV.');
        },

            title: 'Hapus Tagihan?',
            message: `Anda yakin ingin menghapus "${pt.name}"? Transaksi lama tetap aman.`,
            confirmText: 'Ya, Hapus',
            variant: 'danger',
            onConfirm: () => {
              Store.paymentTypes = Store.paymentTypes.filter(p => p.id !== id);
              Store.save();
              Store.showToast(`Tagihan "${pt.name}" telah dihapus.`, 'warning');
            }
          };
          Store.render();
        },

        saveSettingsFromForm() {
          Store.settings.schoolName = document.getElementById('set_schoolName').value;
          Store.settings.schoolAddress = document.getElementById('set_schoolAddress').value;
          Store.settings.officerName = document.getElementById('set_officerName').value;
          Store.settings.className = document.getElementById('set_className').value;
          Store.settings.academicYear = document.getElementById('set_academicYear').value;
          Store.settings.phone = document.getElementById('set_phone').value;
          Store.settings.receiptPrefix = document.getElementById('set_receiptPrefix').value;
          Store.save();
          Store.showToast('Pengaturan sekolah berhasil disimpan.');
        },

        downloadBackupJSON() {
          const data = {
            version: '1.0',
            appName: 'Sistem Pembayaran Kelas 1 SD',
            date: new Date().toISOString(),
            students: Store.students,
            paymentTypes: Store.paymentTypes,
            transactions: Store.transactions,
            settings: Store.settings
          };
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
          const a = document.createElement('a');
          a.setAttribute("href", dataStr);
          a.setAttribute("download", `backup_pembayaran_kelas1_${getTodayISO()}.json`);
          document.body.appendChild(a);
          a.click();
          a.remove();
          Store.showToast('File backup database JSON berhasil diunduh.');
        },

        handleRestoreFile(input) {
          const file = input.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = JSON.parse(e.target.result);
              if (!data.students || !data.paymentTypes) {
                Store.showToast('Format backup JSON tidak valid.', 'error');
                return;
              }
              Store.modal = {
                type: 'CONFIRM',
                title: 'Restore Database?',
                message: `File backup berisi ${data.students.length} siswa dan ${(data.transactions || []).length} transaksi. Tindakan ini akan menimpa data sekarang.`,
                confirmText: 'Ya, Restore Sekarang',
                variant: 'danger',
                onConfirm: () => {
                  if (data.students) Store.students = data.students;
                  if (data.paymentTypes) Store.paymentTypes = data.paymentTypes;
                  if (data.transactions) Store.transactions = data.transactions;
                  if (data.settings) Store.settings = data.settings;
                  Store.save();
                  Store.showToast('Database berhasil dipulihkan dari backup!');
                }
              };
              Store.render();
            } catch(err) {
              Store.showToast('Gagal membaca file JSON.', 'error');
            }
          };
          reader.readAsText(file);
          input.value = '';
        },

        resetTransactionsOnly() {
          Store.modal = {
            type: 'CONFIRM',
            title: 'Hapus Semua Transaksi Kelas?',
            message: 'Tindakan ini akan mengosongkan semua riwayat transaksi pembayaran seluruh siswa di kelas. Data siswa dan tarif tetap aman.',
            confirmText: 'Hapus Semua Transaksi',
            variant: 'danger',
            onConfirm: () => {
              Store.transactions = [];
              Store.save();
              Store.showToast('Semua transaksi kelas telah dikosongkan.', 'warning');
            }
          };
          Store.render();
        },

        factoryReset() {
          Store.modal = {
            type: 'CONFIRM',
            title: 'Reset ke Kondisi Awal Pabrik?',
            message: 'Tindakan ini akan mengembalikan data ke 20 siswa awal dan menghapus seluruh transaksi. Tindakan tidak dapat dibatalkan!',
            confirmText: 'Reset Total',
            variant: 'danger',
            onConfirm: () => {
              Store.students = DEFAULT_STUDENTS;
              Store.paymentTypes = DEFAULT_PAYMENT_TYPES;
              Store.transactions = [];
              Store.settings = DEFAULT_SETTINGS;
              localStorage.clear();
              Store.save();
              Store.showToast('Aplikasi telah di-reset ke kondisi awal.', 'warning');
            }
          };
          Store.render();
        },

        exportExcel() {
          if (typeof XLSX === 'undefined') {
            alert('Library Excel belum siap. Silakan coba kembali.');
            return;
          }
          const wb = XLSX.utils.book_new();

          const studentMatrix = Store.students.filter(s => s.active).map(st => Store.getStudentSummary(st));
          const rowsStudents = studentMatrix.map((item, idx) => ({
            "No": idx + 1,
            "Nama Siswa": item.student.name,
            "Jenis Kelamin": item.student.gender,
            "Kelas": item.student.class || '1',
            "Orang Tua / Wali": item.student.parentName || item.student.father || item.student.mother || '',
            "Ayah": item.student.father || '',
            "Ibu": item.student.mother || '',
            "Pekerjaan": item.student.job || '',
            "TTL": item.student.ttl || '',
            "Alamat": item.student.address || '',
            "Total Tagihan (Rp)": item.totalTarget,
            "Sudah Dibayar (Rp)": item.totalPaid,
            "Sisa Tagihan (Rp)": item.remainingTarget,
            "Status": item.overallStatus
          }));
          XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rowsStudents), "Rekap Siswa");

          const rowsTx = Store.transactions.map((t, idx) => ({
            "No": idx + 1,
            "No Kwitansi": t.receiptNo,
            "Tanggal": t.date,
            "Nama Siswa": t.studentName,
            "Orang Tua / Wali": t.parentName || '',
            "Total (Rp)": t.totalAmount,
            "Uang Diterima (Rp)": t.cashReceived,
            "Kembalian (Rp)": t.changeAmount,
            "Petugas": t.officer || '',
            "Catatan": t.generalNotes || ''
          }));
          XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rowsTx), "Riwayat Transaksi");

          XLSX.writeFile(wb, `Laporan_Pembayaran_Kelas1_${getTodayISO()}.xlsx`);
        }
      };

      // Click outside listener for POS search dropdown
      document.addEventListener('click', function(e) {
        const wrapper = document.getElementById('pos_search_wrapper');
        const dropdown = document.getElementById('pos_student_dropdown');
        if (wrapper && dropdown && !wrapper.contains(e.target)) {
          dropdown.classList.add('hidden');
          Store.pos.dropdownOpen = false;
        }
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          AppActions.openGlobalSearch();
        } else if (e.key === 'Escape') {
          if (Store.modal) AppActions.closeModal();
          const dropdown = document.getElementById('pos_student_dropdown');
          if (dropdown) dropdown.classList.add('hidden');
        }
      });

      Store.init();
      Store.render();
      if (Store.currentTab === 'history') AppActions.updateHistoryTableDOM();
      if (Store.currentTab === 'billing') AppActions.updateBillingTableDOM();
      if (Store.currentTab === 'students') AppActions.updateStudentsTableDOM();
    })();
  </script>
</body>
</html>
